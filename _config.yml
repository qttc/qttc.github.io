title: Coolray X50 Wiki
description: "Вики для владельцев Geely Coolray / Belgee X50: прошивки Community и откат, приложения для головного устройства, CarPlay/Carlinkit, каталоги запчастей, масла и решения частых проблем."
url: "https://qttc.github.io"
baseurl: ""

lang: ru
locale: ru_RU
title_separator: " — "

# Авто-оглавление через kramdown ({:toc}); только разделы и подразделы
kramdown:
  toc_levels: 2..3

author: Coolray X50 Wiki

# SEO (jekyll-seo-tag)
webmaster_verifications:
  google: f8rEymDB4VnmjnuwIVOBfzUtVO3sA2EqenlEly6EEcg
  yandex: 5430c2184744030b
logo: /assets/logo.png
image: /assets/logo.png
social:
  name: Coolray X50 Wiki
  links:
    - https://t.me/CoolRay_Android_Develop

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# PDF не в sitemap: на GitHub Pages их lastmod = время деплоя, Google перестаёт верить датам.
# Находятся по ссылкам со страницы запчастей.
defaults:
  - scope:
      path: "assets/pdf"
    values:
      sitemap: false

# Path
includes_dir: _includes
layouts_dir: _layouts
site_favicon: favicon.ico
